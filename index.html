<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çalışan Deneyimi Platformu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            max-width: 600px;
            width: 100%;
        }
        .main-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .main-header h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .main-header p {
            color: #7f8c8d;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .card h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.4rem;
        }
        .card p {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        
        /* Form Elemanlarını Hizalayan Temiz CSS */
        .recognition-form {
            display: flex !important;
            flex-direction: column !important;
            text-align: left !important;
            gap: 15px !important;
        }
        .form-group {
            display: block !important;
            margin-bottom: 15px;
        }
        .recognition-form label {
            display: block !important;
            font-weight: 600 !important;
            margin-bottom: 8px !important;
            color: #475569 !important;
            font-size: 0.95rem;
        }
        .recognition-form input, 
        .recognition-form textarea,
        .recognition-form select {
            width: 100% !important;
            padding: 10px !important;
            border: 1px solid #cbd5e1 !important;
            border-radius: 6px !important;
            box-sizing: border-box !important;
            display: block !important;
            font-family: inherit;
            background-color: #fff;
        }
        .submit-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .submit-btn:hover {
            background-color: #059669;
        }
        #successMessage {
            display: none;
            background-color: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="main-header">
            <h1>Çalışan Deneyimi Platformu</h1>
            <p>Sesinizi duyurmak ve iş arkadaşlarınızı takdir etmek için harika bir yer!</p>
        </header>

        <!-- TAKDİR PROGRAMI BÖLÜMÜ -->
        <section class="card recognition-section">
            <h2>Bir İş Arkadaşını Takdir Et</h2>
            <p>Başarılı bir çalışmayı veya yardımlaşmayı alkışla!</p>
            
            <form id="customForm" action="https://docs.google.com/forms/d/e/1FAIpQLSekQcOAILxO5POLOeaRHsbkPptNvX85sbpLitkJkmWx4SW42w/viewform?usp=dialog" method="POST" target="hidden_iframe" onsubmit="showSuccess()" class="recognition-form">
                
                <!-- 1. ADIM: DEPARTMAN SEÇİMİ -->
                <div class="form-group">
                    <label for="department-select">Departman Seçin</label>
                    <select id="department-select" onchange="updateEmployeeDropdown()" required>
                        <option value="">Yükleniyor veya Seçiniz...</option>
                    </select>
                </div>

                <!-- 2. ADIM: DİNAMİK ÇALIŞAN SEÇİMİ (Google Form Entry Kimliği Buraya Yazılır) -->
                <div class="form-group">
                    <label for="employee-select">Kimi Takdir Ediyorsun?</label>
                    <select id="employee-select" name="entry.1121950418" required disabled>
                        <option value="">Önce Departman Seçiniz...</option>
                    </select>
                </div>

                <!-- 3. ADIM: NEDEN TAKDİR EDİYORSUN? (Google Form Entry Kimliği Buraya Yazılır) -->
                <div class="form-group">
                    <label for="message">Neden Takdir Ediyorsun?</label>
                    <textarea id="message" name="entry.628692328" rows="4" placeholder="Yaptığı harika işi kısaca anlat..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Takdir Gönder ✨</button>
            </form>

            <div id="successMessage">Takdiriniz başarıyla gönderildi! 🎉</div>
        </section>

    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <!-- SİHİRLİ VERİTABANI VE FİLTRELEME MOTORU (JAVASCRIPT) -->
    <script>
        // Google Apps Script'ten aldığın Web Uygulaması URL'sini buraya yapıştır
        const googleAppsScriptUrl = "https://script.google.com/macros/s/AKfycbxxQJJVTk8AiLBr1i8-lU9GdWXzggwUpsKnVii1v6ZS61vZl0MHRsyk9-UG8r5U2kHq/exec";
        
        let tümCalisanVerisi = [];

        // Sayfa açıldığında Google Sheets'ten verileri otomatik çeken fonksiyon
        async function verileriKöktenCek() {
            try {
                const response = await fetch(googleAppsScriptUrl);
                tümCalisanVerisi = await response.json();
                
                // E-tablodaki benzersiz departmanları bulup Departman Seçim kutusuna doldurur
                const departmanlar = [...new Set(tümCalisanVerisi.map(item => item.Departman))];
                const deptSelect = document.getElementById('department-select');
                
                deptSelect.innerHTML = '<option value="">-- Departman Seçin --</option>';
                departmanlar.forEach(dept => {
                    if(dept) { // Boş satırları filtrele
                        deptSelect.innerHTML += `<option value="${dept}">${dept}</option>`;
                    }
                });
            } catch (error) {
                console.error("Veritabanı bağlantı hatası:", error);
                document.getElementById('department-select').innerHTML = '<option value="">Hata! Veri alınamadı.</option>';
            }
        }

        // Departman seçildiğinde tetiklenen ve sadece o departmanın çalışanlarını listeleyen fonksiyon
        function updateEmployeeDropdown() {
            const secilenDepartman = document.getElementById('department-select').value;
            const employeeSelect = document.getElementById('employee-select');
            
            if (!secilenDepartman) {
                employeeSelect.innerHTML = '<option value="">Önce Departman Seçiniz...</option>';
                employeeSelect.disabled = true;
                return;
            }
            
            // Seçilen departmana ait kişileri filtrele
            const filtrelenmisKisiler = tümCalisanVerisi.filter(item => item.Departman === secilenDepartman);
            
            employeeSelect.innerHTML = '<option value="">-- Çalışan Seçin --</option>';
            filtrelenmisKisiler.forEach(kisi => {
                if(kisi.Isim) { // E-tablondaki sütun başlığın "Isim" olmalı
                    employeeSelect.innerHTML += `<option value="${kisi.Isim}">${kisi.Isim}</option>`;
                }
            });
            
            employeeSelect.disabled = false; // Kutuyu aktif hale getir
        }

        // Başarılı gönderim mesajı ve form sıfırlama
        function showSuccess() {
            document.getElementById('successMessage').style.display = 'block';
            setTimeout(function() {
                document.getElementById('customForm').reset();
                document.getElementById('employee-select').disabled = true;
                document.getElementById('employee-select').innerHTML = '<option value="">Önce Departman Seçiniz...</option>';
            }, 500);
        }

        // Sayfa ilk yüklendiğinde arka planda e-tabloyu oku
        window.onload = verileriKöktenCek;
    </script>

</body>
</html>
